<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IT-Drill — тренажёр IT-инженера</title>
<meta name="description" content="Тренажёр по темам IT: короткое объяснение, три уровня глубины и разборы реальных инцидентов. Linux, сети, базы данных, протоколы, криптография, файловые системы.">
<meta property="og:title" content="IT-Drill — тренажёр IT-инженера">
<meta property="og:description" content="Тренажёр по темам IT: короткое объяснение, три уровня глубины и разборы реальных инцидентов.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://it-drill.tech/">
<link rel="canonical" href="https://it-drill.tech/">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&display=swap">
<style>
*{box-sizing:border-box}
html{color-scheme:light dark}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
:root{
  --bg:#EDF0F4; --surface:#FBFCFD; --surface-2:#F2F5F9;
  --ink:#131820; --ink-2:#394452; --muted:#67717E;
  --rule:#D6DDE5; --rule-strong:#B9C3CF;
  --accent:#1E43B8; --accent-ink:#16307F; --accent-soft:#E1E8FA;
  --ok:#0F6E4F; --ok-soft:#DBEEE4;
  --warn:#8A5A06; --warn-soft:#F5E8CD;
  --gap:#A32F2F; --gap-soft:#F6DEDE;
  --code-bg:#161C24; --code-ink:#DAE2EB; --code-dim:#7F8B99;
  --shadow:0 1px 2px rgba(19,24,32,.05), 0 8px 24px -14px rgba(19,24,32,.30);
  /* высота липкой панели; пересчитывается из app.js, см. syncBarOffset() */
  --barh:132px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1116; --surface:#141A22; --surface-2:#1A222C;
    --ink:#E6EBF1; --ink-2:#B4BFCB; --muted:#8A95A3;
    --rule:#252F3B; --rule-strong:#37434F;
    --accent:#8CA9FF; --accent-ink:#B9CBFF; --accent-soft:#182240;
    --ok:#5CCB9D; --ok-soft:#122B21;
    --warn:#DFB160; --warn-soft:#2C2312;
    --gap:#EC8A8A; --gap-soft:#321A1A;
    --code-bg:#080C11; --code-ink:#C9D3DF; --code-dim:#6C7887;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -18px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --bg:#0D1116; --surface:#141A22; --surface-2:#1A222C;
  --ink:#E6EBF1; --ink-2:#B4BFCB; --muted:#8A95A3;
  --rule:#252F3B; --rule-strong:#37434F;
  --accent:#8CA9FF; --accent-ink:#B9CBFF; --accent-soft:#182240;
  --ok:#5CCB9D; --ok-soft:#122B21;
  --warn:#DFB160; --warn-soft:#2C2312;
  --gap:#EC8A8A; --gap-soft:#321A1A;
  --code-bg:#080C11; --code-ink:#C9D3DF; --code-dim:#6C7887;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -18px rgba(0,0,0,.9);
}

*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
  font-size:15px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1020px; margin:0 auto; padding:0 20px 96px}

/* ---------- header ---------- */
header.top{padding:44px 0 26px; border-bottom:1px solid var(--rule)}
.toprow{display:flex; justify-content:space-between; align-items:flex-start; gap:12px}
.gh{
  flex:0 0 auto; display:flex; align-items:center; justify-content:center;
  width:32px; height:32px; border:1px solid var(--rule-strong);
  background:var(--surface); color:var(--ink-2); border-radius:2px;
}
.gh:hover{border-color:var(--accent); color:var(--accent)}
.gh svg{display:block; width:18px; height:18px; fill:currentColor}
.eyebrow{
  font-family:"IBM Plex Mono", ui-monospace, monospace;
  font-size:11.5px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--accent); font-weight:500;
}
h1{
  font-family:"IBM Plex Serif", Georgia, serif; font-weight:600;
  font-size:clamp(30px, 5vw, 44px); line-height:1.12; letter-spacing:-.015em;
  margin:12px 0 0; text-wrap:balance; max-width:16ch;
}
.lede{margin:14px 0 0; max-width:62ch; color:var(--ink-2); font-size:16px}
.meta{
  display:flex; flex-wrap:wrap; gap:8px 22px; margin-top:20px;
  font-family:"IBM Plex Mono", monospace; font-size:12px; color:var(--muted);
}
.meta b{color:var(--ink-2); font-weight:500}

/* ---------- two-day plan ---------- */
.plan{display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--rule); border:1px solid var(--rule); margin:28px 0 0}
@media (max-width:900px){.plan{grid-template-columns:repeat(2,1fr)}}
@media (max-width:520px){.plan{grid-template-columns:1fr}}
.slot{background:var(--surface); padding:14px 16px}
.slot .when{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
.slot .what{margin-top:5px; font-weight:600; font-size:14.5px}
.slot .how{margin-top:3px; font-size:13px; color:var(--ink-2)}

.barhead{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:12px}
.barhead .views{margin-bottom:0}
.langs .vbtn{font-family:"IBM Plex Mono",monospace; font-size:12px; letter-spacing:.06em; padding:9px 13px}
.tag.untr{color:var(--warn); border-color:var(--warn); cursor:help}
.notice{
  margin:16px 0 0; padding:9px 12px; border-left:3px solid var(--warn);
  background:var(--warn-soft); color:var(--ink-2);
  font-family:"IBM Plex Mono",monospace; font-size:12px; line-height:1.5;
}

/* ---------- view switcher ---------- */
.views{display:flex; gap:0; margin-bottom:12px; border:1px solid var(--rule-strong); width:fit-content; border-radius:2px; overflow:hidden}
.vbtn{
  font:500 13px/1 "IBM Plex Sans",sans-serif; padding:9px 16px; cursor:pointer;
  border:0; border-right:1px solid var(--rule-strong); background:var(--surface); color:var(--ink-2);
}
.vbtn:last-child{border-right:0}
.vbtn span{font-family:"IBM Plex Mono",monospace; font-size:11px; opacity:.55; margin-left:6px}
.vbtn[aria-pressed="true"]{background:var(--ink); color:var(--bg)}

/* ---------- cases ---------- */
.caseintro{margin:0 0 18px; max-width:62ch; color:var(--ink-2); font-size:14.5px}
.case{border-bottom:1px solid var(--rule); padding:22px 0; scroll-margin-top:calc(var(--barh) + 14px)}
.case.hidden{display:none}
.chead{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:10px}
.sev{font:500 10.5px/1 "IBM Plex Mono",monospace; letter-spacing:.1em; padding:4px 7px; border:1px solid currentColor}
.sev.P1{color:var(--gap)} .sev.P2{color:var(--warn)} .sev.P3{color:var(--muted)}
.cid{font:500 11.5px/1 "IBM Plex Mono",monospace; color:var(--muted); font-variant-numeric:tabular-nums}
.ctitle{
  font-family:"IBM Plex Serif",Georgia,serif; font-weight:600; font-size:19px; line-height:1.3;
  margin:0 0 12px; letter-spacing:-.01em; text-wrap:pretty;
}
.sym{font-size:14.5px; color:var(--ink-2); margin:0 0 2px; max-width:70ch}
.cbody .h{
  font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--muted); margin:0 0 8px;
}
.cbody{margin-top:16px; border:1px solid var(--rule); background:var(--surface); box-shadow:var(--shadow)}
.cbody .pane{padding:16px 18px; border-top:1px solid var(--rule)}
.cbody .pane:first-child{border-top:0}
.cbody ol{margin:0; padding-left:20px; display:flex; flex-direction:column; gap:8px}
.cbody ul{margin:0; padding-left:18px; display:flex; flex-direction:column; gap:8px}
.cbody li{font-size:14.5px; color:var(--ink-2)}
.cbody li b{color:var(--ink); font-weight:600}
.cause{border-left:3px solid var(--accent); background:var(--accent-soft)}
.cause .h{color:var(--accent-ink)}
.cause p{margin:0; font-size:15px; color:var(--ink)}
.trap{background:var(--surface-2)}
.trap p{margin:0; font-size:14px; color:var(--ink-2)}
.solve{margin-top:12px}

/* ---------- toolbar ---------- */
.bar{
  position:sticky; top:0; z-index:20; background:var(--bg);
  padding:14px 0 12px; border-bottom:1px solid var(--rule); margin-bottom:6px;
}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{
  font:500 12.5px/1 "IBM Plex Mono", monospace;
  padding:7px 11px; border:1px solid var(--rule-strong); background:var(--surface);
  color:var(--ink-2); cursor:pointer; border-radius:2px; letter-spacing:.02em;
}
.chip:hover{border-color:var(--accent); color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:#fff}
:root[data-theme="dark"] .chip[aria-pressed="true"], :root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#0D1116}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .chip[aria-pressed="true"]{color:#fff}}
.chip .n{opacity:.6; margin-left:5px}
.row2{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:10px}
input[type="search"]{
  flex:1 1 220px; min-width:0; font:400 14px/1 "IBM Plex Sans",sans-serif;
  padding:9px 11px; border:1px solid var(--rule-strong); background:var(--surface);
  color:var(--ink); border-radius:2px;
}
input[type="search"]::placeholder{color:var(--muted)}
.btn{
  font:500 12.5px/1 "IBM Plex Mono", monospace; padding:9px 12px; cursor:pointer;
  border:1px solid var(--rule-strong); background:var(--surface); color:var(--ink-2); border-radius:2px;
}
.btn:hover{border-color:var(--accent); color:var(--accent)}
.btn[aria-pressed="true"]{background:var(--accent-soft); border-color:var(--accent); color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* ---------- progress ---------- */
.progress{margin:16px 0 4px; display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px 16px}
.pcell .plabel{display:flex; justify-content:space-between; font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--muted); letter-spacing:.06em; text-transform:uppercase}
.pbar{display:flex; height:5px; margin-top:6px; background:var(--rule); overflow:hidden}
.pbar i{display:block; height:100%}
.pbar .s3{background:var(--ok)} .pbar .s2{background:var(--warn)} .pbar .s1{background:var(--gap)}

/* ---------- list ---------- */
.count{font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--muted); margin:18px 0 2px}
.qlist{border-top:1px solid var(--rule)}
.item{border-bottom:1px solid var(--rule); padding:16px 0; scroll-margin-top:calc(var(--barh) + 14px)}
.item.hidden{display:none}
.ihead{display:flex; gap:12px; align-items:flex-start}
.idx{
  font-family:"IBM Plex Mono",monospace; font-size:11.5px; font-weight:500;
  color:var(--muted); padding-top:4px; white-space:nowrap; flex:0 0 auto;
  font-variant-numeric:tabular-nums;
}
.qmain{flex:1 1 auto; min-width:0}
.qtext{
  font-family:"IBM Plex Serif", Georgia, serif; font-weight:500;
  font-size:17px; line-height:1.4; letter-spacing:-.005em; margin:0; cursor:pointer;
  text-wrap:pretty;
}
.qtext:hover{color:var(--accent)}
.tags{display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:9px}
.tag{
  font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--muted); border:1px solid var(--rule); padding:3px 6px;
}
.tag.hard{color:var(--gap); border-color:var(--gap)}
.lvl{
  font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.08em;
  text-transform:uppercase; padding:3px 6px; border:1px solid;
}
.lvl.jun{color:var(--muted); border-color:var(--rule-strong); background:transparent}
.lvl.mid{color:var(--ink); border-color:var(--ink-2); background:transparent}
.lvl.sen{color:var(--bg); border-color:var(--ink); background:var(--ink)}
.ladder{border-top:1px solid var(--rule); background:var(--surface-2)}
.ladder ul{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:8px}
.ladder li{display:flex; gap:9px; align-items:baseline; font-size:14px}
.ladder a{color:var(--ink-2); text-decoration:none; border-bottom:1px solid var(--rule-strong); cursor:pointer}
.ladder a:hover{color:var(--accent); border-color:var(--accent)}
.lchips{display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom:8px}
.lchips .lab{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-right:2px}
.marks{display:flex; gap:4px; margin-left:auto; flex:0 0 auto}
.mark{
  width:26px; height:26px; border:1px solid var(--rule-strong); background:var(--surface);
  cursor:pointer; font:500 13px/1 "IBM Plex Mono",monospace; color:var(--muted); border-radius:2px;
  display:flex; align-items:center; justify-content:center;
}
.mark:hover{border-color:var(--rule-strong); color:var(--ink)}
.mark[data-v="3"][aria-pressed="true"]{background:var(--ok-soft); border-color:var(--ok); color:var(--ok)}
.mark[data-v="2"][aria-pressed="true"]{background:var(--warn-soft); border-color:var(--warn); color:var(--warn)}
.mark[data-v="1"][aria-pressed="true"]{background:var(--gap-soft); border-color:var(--gap); color:var(--gap)}

/* ---------- answer ---------- */
.ans{margin-top:14px; background:var(--surface); border:1px solid var(--rule); box-shadow:var(--shadow)}
.ans .pane{padding:16px 18px}
.short{border-left:3px solid var(--accent); background:var(--accent-soft)}
.short .h, .deep .h, .fu .h, .ladder .h{
  font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--muted); margin:0 0 7px;
}
.short .h{color:var(--accent-ink)}
.short p{margin:0; font-size:15px; color:var(--ink)}
.deep{border-top:1px solid var(--rule)}
.deep ul{margin:0; padding-left:18px; display:flex; flex-direction:column; gap:7px}
.deep li{font-size:14.5px; color:var(--ink-2)}
.deep li b{color:var(--ink); font-weight:600}
.fu{border-top:1px solid var(--rule); background:var(--surface-2)}
.fu ul{margin:0; padding-left:18px; display:flex; flex-direction:column; gap:5px}
.fu li{font-size:13.5px; color:var(--ink-2)}
pre{
  margin:12px 0 0; background:var(--code-bg); color:var(--code-ink);
  padding:12px 14px; overflow-x:auto; border-radius:2px;
  font-family:"IBM Plex Mono",monospace; font-size:12.5px; line-height:1.55;
}
pre .c{color:var(--code-dim)}
code{font-family:"IBM Plex Mono",monospace; font-size:.9em; background:var(--surface-2); padding:1px 4px; border:1px solid var(--rule); border-radius:2px}
.short code, .fu code{background:var(--surface)}

footer.end{margin-top:40px; padding-top:20px; border-top:1px solid var(--rule); font-size:13px; color:var(--muted)}
footer.end a{color:var(--accent)}
.empty{padding:40px 0; color:var(--muted); font-family:"IBM Plex Mono",monospace; font-size:13px}
@media (prefers-reduced-motion:no-preference){.ans{animation:in .16s ease-out}}
@keyframes in{from{opacity:.3; transform:translateY(-3px)} to{opacity:1; transform:none}}
@media (max-width:600px){
  .marks{margin-left:0; order:3}
  .idx{display:none}
  .qtext{font-size:16px}
}
label.btn{display:inline-flex; align-items:center}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <div class="toprow">
    <div class="eyebrow" id="brand"></div>
    <a class="gh" href="https://github.com/Rogembaum/it-drill-tech" target="_blank" rel="noopener noreferrer" aria-label="GitHub: Rogembaum/it-drill-tech" title="GitHub">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
    </a>
  </div>
  <h1 id="siteTitle"></h1>
  <p class="lede" id="siteLede"></p>
  <div class="meta">
    <span><b id="mTotal">0</b> <span id="mTotalW">вопросов</span></span>
    <span><b id="mLv">—</b></span>
    <span><b id="mCases">0</b> <span id="mCasesW">разборов инцидентов</span></span>
    <span id="mStorage"></span>
  </div>
  <div class="plan" id="plan"></div>
</header>

<div class="bar">
  <div class="barhead">
    <div class="views" id="views">
      <button class="vbtn" id="vQ" data-v="q" aria-pressed="true">Вопросы <span id="nQ">0</span></button>
      <button class="vbtn" id="vC" data-v="c" aria-pressed="false">Кейсы <span id="nC">0</span></button>
    </div>
    <div class="views langs" id="langs" role="group" aria-label="Язык / Language"></div>
  </div>
  <div class="lchips" id="lvlchips"></div>
  <div class="chips" id="chips"></div>
  <div class="chips" id="casechips" hidden></div>
  <div class="row2">
    <input type="search" id="q" placeholder="Поиск: TIME_WAIT, vacuum, inode, GCM…" aria-label="Поиск по вопросам">
    <button class="btn" id="fUnknown" aria-pressed="false"></button>
    <button class="btn" id="fUnseen" aria-pressed="false"></button>
    <button class="btn" id="rnd"></button>
    <button class="btn" id="toggleAll" aria-pressed="false"></button>
    <button class="btn" id="reset"></button>
    <button class="btn" id="exportBtn"></button>
    <label class="btn" id="importLabel" for="importFile">&nbsp;<input type="file" id="importFile" accept="application/json" hidden></label>
  </div>
</div>

<div class="progress" id="progress"></div>

<div class="notice" id="langNote" hidden></div>

<div class="count" id="count"></div>
<div class="qlist" id="list"></div>

<div id="casewrap" hidden>
  <p class="caseintro" id="caseLede"></p>
  <div class="qlist" id="caselist"></div>
</div>

<footer class="end"><span id="siteFooter"></span></footer>
</div>

<script src="data/i18n.js"></script>
<script src="data/config.js"></script>
<script src="data/questions.js"></script>
<script src="data/cases.js"></script>
<script src="app.js"></script>
</body>
</html>
