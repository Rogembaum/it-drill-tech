apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: vllm
  namespace: ai-lab
spec:
  scaleTargetRef:
    name: vllm
  # одна тёплая реплика: без неё каждый всплеск ждёт загрузки весов
  minReplicaCount: 1
  # потолок — число GPU в пуле; выше поды останутся в Pending
  maxReplicaCount: 4
  pollingInterval: 15
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 600
          policies:
            - type: Pods
              value: 1
              periodSeconds: 120
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-server.monitoring.svc:80
        query: sum(vllm:num_requests_waiting{namespace="ai-lab"})
        threshold: "4"
