# LiteLLM proxy. Работает, но в ревью ИБ не пройдёт.
model_list:
  - model_name: qwen-coder-local
    litellm_params:
      model: hosted_vllm/Qwen/Qwen2.5-Coder-32B-Instruct
      api_base: http://203.0.113.10:8000/v1
  - model_name: deepseek-cloud
    litellm_params:
      model: openrouter/deepseek/deepseek-chat-v3.1
      api_key: sk-or-v1-0123456789abcdef0123456789abcdef

router_settings:
  fallbacks:
    - qwen-coder-local: ["deepseek-cloud"]

general_settings:
  master_key: sk-1234
