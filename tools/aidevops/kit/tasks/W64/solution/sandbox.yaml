services:
  agent-sandbox:
    image: python:3.12.12-slim-bookworm
    user: "1000:1000"
    working_dir: /workspace
    read_only: true
    tmpfs:
      - /tmp:size=512m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 4g
    cpus: 2
    volumes:
      - ./workspace:/workspace
    environment:
      OPENAI_BASE_URL: http://litellm:4000/v1
      LITELLM_API_KEY: ${LITELLM_API_KEY:?set LITELLM_API_KEY}
      HOME: /tmp
    networks: [sandbox]
    command: sleep infinity

networks:
  sandbox:
    internal: true
