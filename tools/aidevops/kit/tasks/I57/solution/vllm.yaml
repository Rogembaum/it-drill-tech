apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-qwen-coder
  namespace: ai-inference
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: vllm-qwen-coder}
  template:
    metadata:
      labels: {app: vllm-qwen-coder}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.11.0
          args:
            - --model
            - /models/Qwen2.5-Coder-32B-Instruct
            - --served-model-name
            - qwen-coder
            - --max-model-len
            - "32768"
            - --gpu-memory-utilization
            - "0.90"
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: VLLM_API_KEY
              valueFrom:
                secretKeyRef: {name: vllm-api-key, key: api-key}
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: HOME
              value: /tmp
          resources:
            requests: {cpu: "4", memory: 64Gi, nvidia.com/gpu: 1}
            limits: {memory: 64Gi, nvidia.com/gpu: 1}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - {name: models, mountPath: /models, readOnly: true}
            - {name: shm, mountPath: /dev/shm}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: models
          persistentVolumeClaim: {claimName: models-approved, readOnly: true}
        - name: shm
          emptyDir: {medium: Memory, sizeLimit: 16Gi}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-qwen-coder
  namespace: ai-inference
spec:
  type: ClusterIP
  selector: {app: vllm-qwen-coder}
  ports:
    - name: http
      port: 8000
      targetPort: http
