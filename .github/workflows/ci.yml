name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan git history for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Scan Terraform configuration
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          output_format: cli
          # Checkov treats this sensitive variable reference as a hard-coded password.
          skip_check: CKV_OPENSTACK_1
          soft_fail: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Validate JavaScript and site data
        run: node tools/validate.mjs

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive
        working-directory: terraform

      - name: Initialize Terraform without remote state
        run: terraform init -backend=false -input=false -lockfile=readonly -no-color
        working-directory: terraform

      - name: Validate Terraform configuration
        run: terraform validate -no-color
        working-directory: terraform

  cd:
    name: cd
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: it-drill
      url: https://www.it-drill.tech/
    concurrency:
      group: cd-it-drill
      cancel-in-progress: false
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}
      AWS_DEFAULT_REGION: ru-1
      AWS_ENDPOINT_URL: https://s3.ru-1.storage.selcloud.ru
      # Цепочка Selectel ведёт к GlobalSign Root R6: его нет в хранилище aws-cli, но есть в системном.
      AWS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      # Selectel не принимает CRC-контрольные суммы, которые aws-cli 2.23+ шлёт по умолчанию.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      BUCKET: it-drill-tech
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build dist
        run: python3 tools/build-dist.py

      # Имена файлов без хешей: no-cache заставляет браузер сверять ETag и сразу видеть новую версию.
      - name: Upload to S3
        run: aws s3 sync dist/ "s3://$BUCKET/" --delete --no-progress --cache-control "no-cache"

      - name: Show S3 TLS chain
        if: failure()
        run: |
          aws --version
          host="${AWS_ENDPOINT_URL#https://}"
          openssl s_client -connect "$host:443" -servername "$host" -showcerts </dev/null 2>&1 \
            | grep -E '^ *[0-9]+ s:|^ *i:|Verify return code'
